name: Publish to npm
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag created by Release Please
        required: true
        type: string
permissions: {}
concurrency:
  group: npm-publish-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "24.22.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          expected_version=$(node -p "require('./package.json').version")
          case "$RELEASE_TAG" in
            "$expected_version"|"v$expected_version") ;;
            *)
              echo "Release tag $RELEASE_TAG does not match package version $expected_version" >&2
              exit 1
              ;;
          esac
          npm --version
      - name: Skip an already published version
        id: check_published
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package with npm trusted publishing
        if: ${{ steps.check_published.outputs.published != 'true' }}
        run: npm publish --access public
